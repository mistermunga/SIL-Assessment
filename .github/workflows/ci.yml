name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Format, generated code, vet, and the full test suite against a throwaway Postgres.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://clinic:clinic@localhost:5432/clinic_test?sslmode=disable

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check generated code is current
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc diff

      - name: Apply migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
          goose -dir db/migrations postgres "$TEST_DATABASE_URL" up

      - run: go vet ./...
      - run: go test -p 1 -race -count=1 ./...

  # Catches broken Docker, compose, nginx and shell files before they reach the server.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build the app image
        run: docker build --target runtime -t clinic-app:ci .

      - name: Validate docker-compose.yaml
        env:
          POSTGRES_PASSWORD: ci
          CLINIC_DB_PASSWORD: ci
          CLINIC_TEST_DB_PASSWORD: ci
          JWT_SECRET: ci-secret-of-at-least-32-characters-long
          CLINIC_TIMEZONE: Africa/Nairobi
          ADMIN_PASSWORD: ci-password
          DOMAIN: clinic.example.com
          LETSENCRYPT_EMAIL: ci@example.com
        run: docker compose config -q

      - name: Validate the nginx configuration
        run: |
          certs=$(mktemp -d)
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=localhost" \
            -keyout "$certs/privkey.pem" -out "$certs/fullchain.pem"
          docker run --rm \
            -v "$PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$certs:/etc/letsencrypt/live/clinic:ro" \
            nginx:1.28-alpine nginx -t

      - name: Lint the shell scripts
        run: shellcheck --severity=warning deploy/*.sh deploy/postgres/init/*.sh

  # Main only, and only when both checks above passed.
  deploy:
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd /srv/clinic && git fetch --prune origin && git checkout --force --detach $SHA && deploy/deploy.sh"

      - name: Check the public endpoint
        env:
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          [ -n "$DEPLOY_DOMAIN" ] || { echo "DEPLOY_DOMAIN is not set; skipping"; exit 0; }
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 10 \
            "https://$DEPLOY_DOMAIN/healthz"