log_format clinic '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time rid=$request_id';

# Login and registration are limited per IP; an empty key means "not limited".
map $uri $auth_key {
    default               "";
    ~^/(login|patients)$  $binary_remote_addr;
}
limit_req_zone $auth_key           zone=auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_status 429;

# Health checks: reachable only from inside this container, no TLS, no redirect.
server {
    listen 127.0.0.1:8081;
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /healthz {          # nginx -> app -> database
        set $app http://app:8060;
        proxy_pass $app;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}

# Plain HTTP: certificate challenges, then everything else goes to HTTPS.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log /dev/stdout clinic;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;          # matches the app's own 1 MiB cap
    access_log /dev/stdout clinic;

    ssl_certificate     /etc/letsencrypt/live/clinic/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Start short. Raise to 31536000 (one year) after a week of working HTTPS,
    # because browsers refuse plain HTTP for the whole max-age once they have seen it.
    add_header Strict-Transport-Security "max-age=300" always;

    # Docker's DNS, re-resolved at request time: a replaced app container gets a new IP,
    # and nginx must still start when the app does not exist yet (first deploy).
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        limit_req zone=auth    burst=5  nodelay;
        limit_req zone=general burst=60 nodelay;

        set $app http://app:8060;
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;   # the app keeps it, so both logs share the ID
        proxy_connect_timeout 3s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
    }

    error_page 429 @too_many;
    error_page 502 503 504 @unavailable;
    location @too_many {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"too many requests"}}';
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"unavailable","message":"service temporarily unavailable"}}';
    }
}